plugins {
    id 'com.android.application'
}

// A project-local debug keystore keeps the signature stable across builds,
// so updates install over the previous version without uninstalling.
def projectKeystore = rootProject.file('debug.keystore')

android {
    namespace 'dev.glasshome.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.glasshome.launcher'
        minSdk 30          // Fire OS 8 (Android 11)
        targetSdk 30
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        debug {
            if (projectKeystore.exists()) {
                storeFile projectKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
